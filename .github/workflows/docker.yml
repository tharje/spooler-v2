name: Publish Docker image

on:
  push:
    branches: [main]
    # Releases and pre-releases: v2.3.0 -> :2.3.0 + :latest, v2.3.0-beta.1 -> :2.3.0-beta.1 + :beta.
    # :latest never points to a pre-release (see scripts/docker-tags.sh).
    tags: ["v*"]

jobs:
  # Duplicated from tests.yml rather than referenced: GitHub Actions has no
  # cross-workflow "needs", so gating the image push on green tests requires
  # its own test job in this workflow file too.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: tags
        run: |
          changelog_version="$(python3 -c "import json; print(json.load(open('public/changelog.json'))[0]['version'])")"
          tags="$(scripts/docker-tags.sh "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$changelog_version")"
          echo "Publishing: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
