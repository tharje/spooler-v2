name: Tests

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # test_frontend_split.py parses every app-*.js with `node --check` and
      # skips silently when node is missing -- without this step the checks
      # that keep the no-build-step frontend honest never run in CI.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

  # The same image check that gates publishing, so a missing file in the image
  # or a wrong websockets version shows up on the pull request.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and check that it starts and answers
        run: scripts/docker-smoke-test.sh
